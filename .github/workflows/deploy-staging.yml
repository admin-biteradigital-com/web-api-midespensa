name: Deploy to Staging

on:
  push:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-fund
        working-directory: worker

      - name: Deploy Worker to Cloudflare Workers (Staging)
        run: npx wrangler deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 69880180c9b38ae06acef2a021729a72

      - name: Deploy Client to Cloudflare Pages (Staging)
        run: |
          npx wrangler pages project list
          npx wrangler pages deploy ../client --project-name=midespensa-client --branch=staging --commit-dirty=true
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 69880180c9b38ae06acef2a021729a72

      - name: Audit - CD Deploy Staging
        run: node scripts/record-audit-log.js CD_DEPLOY_STAGING "{\"commit\":\"${{ github.sha }}\",\"actor\":\"${{ github.actor }}\",\"environment\":\"staging\"}"
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
