name: Build Check

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  build:
    name: Build and Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde8c81c89c3166c0 # v4.2.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-fund
        working-directory: worker

      - name: Audit - CI Build Started
        if: always()
        run: node scripts/record-audit-log.js CI_BUILD_STARTED "{\"commit\":\"${{ github.sha }}\",\"actor\":\"${{ github.actor }}\",\"branch\":\"${{ github.ref_name }}\"}"
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          WORKER_URL: ${{ secrets.WORKER_URL }}

      - name: TypeScript Compile / Check
        run: npx tsc
        working-directory: worker

      - name: Audit - CI Build Success
        if: success()
        run: node scripts/record-audit-log.js CI_BUILD_SUCCESS "{\"commit\":\"${{ github.sha }}\",\"status\":\"success\"}"
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          WORKER_URL: ${{ secrets.WORKER_URL }}

      - name: Audit - CI Build Failed
        if: failure()
        run: node scripts/record-audit-log.js CI_BUILD_FAILED "{\"commit\":\"${{ github.sha }}\",\"status\":\"failed\"}"
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
