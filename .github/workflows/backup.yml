name: Daily D1 Database Backup

on:
  schedule:
    - cron: '0 4 * * *' # Executed daily at 04:00 UTC
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  backup:
    name: Backup D1 Database & Record Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-fund
        working-directory: worker

      - name: Audit - Daily Backup Started
        if: always()
        run: node scripts/record-audit-log.js DAILY_BACKUP_STARTED "{\"actor\":\"github_actions_cron\"}"
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          WORKER_URL: ${{ secrets.WORKER_URL }}

      - name: Export D1 Database Dump
        run: npx wrangler d1 export midespensa-db --remote --output ./backup.sql
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Compress Backup File
        run: |
          mkdir -p ./backups
          gzip -c ./worker/backup.sql > ./backups/d1-backup-$(date +%Y-%m-%d).sql.gz

      - name: Audit - Daily Backup Completed
        if: success()
        run: node scripts/record-audit-log.js DAILY_BACKUP_SUCCESS "{\"status\":\"success\"}"
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
