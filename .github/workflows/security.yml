name: Security & Drift Check

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  security:
    name: Security Scan and Configuration Drift Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde8c81c89c3166c0 # v4.2.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: worker

      - name: Run Configuration Drift Check
        run: node scripts/drift-check.js

      - name: Run Security Audit (High/Critical Gates — Production Deps)
        run: npm audit --omit=dev --audit-level=high
        working-directory: worker

      - name: Audit - Security Scan Passed
        if: success()
        run: node scripts/record-audit-log.js SECURITY_SCAN_PASSED "{\"commit\":\"${{ github.sha }}\",\"status\":\"passed\"}"
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          WORKER_URL: ${{ secrets.WORKER_URL }}

      - name: Audit - Security Scan Failed
        if: failure()
        run: node scripts/record-audit-log.js SECURITY_SCAN_FAILED "{\"commit\":\"${{ github.sha }}\",\"status\":\"failed\"}"
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
